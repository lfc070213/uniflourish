<script>
(async ()=>{
    const OLD = "uniflourish_v1.5.3_stable";
    try {
        document.body.innerText = "Opening DB...";
        const db = await new Promise(r=>{const q=indexedDB.open("UniflourishDB",1);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
        if(!db){document.body.innerText="❌ IndexedDB 'UniflourishDB' not found";return;}
        document.body.innerText = "Reading key: "+OLD;
        const val = await new Promise(r=>{const g=db.transaction("store","readonly").objectStore("store").get(OLD);g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)});
        if(!val){document.body.innerText="❌ Key not found. Type: "+typeof val;return;}
        if(!val.length){document.body.innerText="❌ Empty array";return;}
        document.body.innerHTML = "<h2>✅ Found "+val.length+" sessions!</h2>"+
          "<p>First session: "+val[0].title+" ("+val[0].messages.length+" msgs)</p>"+
          "<textarea style='width:100%;height:400px'>"+JSON.stringify(val,null,2).substring(0,100000)+"</textarea>"+
          "<p>Select all text above and copy, then paste to Claude</p>";
    } catch(e) { document.body.innerText = "Error: "+e.message+"\n"+e.stack; }
})()
</script>
